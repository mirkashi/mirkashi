    <text x="70" y="672" font-size="22" fill="#9fb3d1" opacity=".9"
          textLength="600" lengthAdjust="spacingAndGlyphs">weekly report system</text>
  </g>
  <rect x="0" y="0" width="1280" height="6" fill="#FBBF24" opacity=".85"/>
