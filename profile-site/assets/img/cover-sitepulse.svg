  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <g opacity=".9">
    <circle cx="1000" cy="330" r="150" fill="none" stroke="#5EEAD4" stroke-width="3" opacity=".3"/>
    <path d="M870 400 A150 150 0 0 1 1105 245" fill="none" stroke="#5EEAD4" stroke-width="16" stroke-linecap="round" opacity=".85"/>
    <path d="M1000 330 L1082 262" stroke="#5EEAD4" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1000" cy="330" r="13" fill="#5EEAD4"/>
