<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="SitePulse cover art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="55%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#04070f"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
