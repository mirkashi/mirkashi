      <stop offset="45%" stop-color="#04070f" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#04070f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <g opacity=".9">
    <g opacity=".9">
      <rect x="840" y="160" width="330" height="60" rx="12" fill="#FCD34D" opacity=".22"/>
      <rect x="840" y="240" width="330" height="60" rx="12" fill="#FCD34D" opacity=".16"/>
      <rect x="840" y="320" width="330" height="60" rx="12" fill="#FCD34D" opacity=".12"/>
      <rect x="840" y="400" width="330" height="60" rx="12" fill="#FCD34D" opacity=".08"/>
    </g>
    <circle cx="880" cy="190" r="16" fill="#FCD34D" opacity=".8"/>
    <circle cx="880" cy="270" r="16" fill="#FCD34D" opacity=".6"/>
    <circle cx="880" cy="350" r="16" fill="#FCD34D" opacity=".45"/>
    <rect x="915" y="182" width="120" height="14" rx="7" fill="#FCD34D" opacity=".7"/>
