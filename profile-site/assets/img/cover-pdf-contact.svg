<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="PDF Contact Extractor cover art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="55%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#04070f"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="60%">
