    <rect x="915" y="342" width="100" height="14" rx="7" fill="#FCD34D" opacity=".35"/>
    <rect x="1075" y="180" width="70" height="18" rx="9" fill="#FCD34D" opacity=".45"/></g>
  <rect width="1280" height="720" fill="url(#fade)"/>
  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <text x="70" y="562" font-size="20" fill="#FCD34D" opacity=".85" letter-spacing="4">OFFLINE OCR PIPELINE</text>
    <text x="70" y="628" font-size="56" fill="#f8fafc" font-weight="700"
