<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="AI Chatbot cover art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#04070f"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#8ea3c8" stroke-width="1" opacity=".09"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#04070f" stop-opacity=".96"/>
      <stop offset="45%" stop-color="#04070f" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#04070f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <g opacity=".9">
    <rect x="820" y="170" width="300" height="120" rx="26" fill="#67E8F9" opacity=".2" stroke="#67E8F9" stroke-width="3"/>
    <rect x="900" y="330" width="300" height="120" rx="26" fill="#67E8F9" opacity=".12" stroke="#67E8F9" stroke-width="3"/>
    <g fill="#67E8F9" opacity=".8">
      <circle cx="880" cy="230" r="9"/><circle cx="915" cy="230" r="9"/><circle cx="950" cy="230" r="9"/>
    </g>
    <rect x="940" y="372" width="180" height="12" rx="6" fill="#67E8F9" opacity=".55"/>
    <rect x="940" y="400" width="130" height="12" rx="6" fill="#67E8F9" opacity=".35"/>
    <path d="M1210 330 q60 40 10 110" fill="none" stroke="#67E8F9" stroke-width="4" opacity=".4"/></g>
  <rect width="1280" height="720" fill="url(#fade)"/>
  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <text x="70" y="562" font-size="20" fill="#67E8F9" opacity=".85" letter-spacing="4">LLM + LANGCHAIN + STREAMLIT</text>
    <text x="70" y="628" font-size="56" fill="#f8fafc" font-weight="700"
          textLength="760" lengthAdjust="spacingAndGlyphs">AI Chatbot</text>
    <text x="70" y="672" font-size="22" fill="#9fb3d1" opacity=".9"
          textLength="600" lengthAdjust="spacingAndGlyphs">LLM + LangChain + Streamlit</text>
  </g>
  <rect x="0" y="0" width="1280" height="6" fill="#67E8F9" opacity=".85"/>
