  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <g opacity=".9">
    <rect x="880" y="150" width="250" height="330" rx="18" fill="none" stroke="#A78BFA" stroke-width="3" opacity=".55"/>
    <rect x="915" y="205" width="180" height="12" rx="6" fill="#A78BFA" opacity=".7"/>
    <rect x="915" y="240" width="140" height="12" rx="6" fill="#A78BFA" opacity=".45"/>
    <rect x="915" y="275" width="165" height="12" rx="6" fill="#A78BFA" opacity=".45"/>
