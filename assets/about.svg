family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A7B9D2">I'm Mir Kashif — a full-stack developer from Islamabad, Pakistan. I design</text><text x="58" y="240" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A7B9D2">and build responsive products where strong visuals meet dependable</text><text x="58" y="260" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A7B9D2">engineering — from the first wireframe to the production deploy.</text><rect x="58" y="290" width="64" height="1" fill="url(#accentBar)" opacity=".8"/><path d="M60 316 l4 -4 4 4 -4 4 Z" fill="#22D3EE" opacity=".85"/><text x="76" y="320" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#22D3EE" letter-spacing="1.2">PRODUCT UI</text><text x="224" y="320" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.2" font-weight="400" fill="#7C8EA9">responsive, accessible, built to be used daily</text>,<path d="M60 338 l4 -4 4 4 -4 4 Z" fill="#A78BFA" opacity=".85"/><text x="76" y="342" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#7FE3F5" letter-spacing="1.2">FULL-STACK APPS</text><text x="224" y="342" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.2" font-weight="400" fill="#7C8EA9">simple user flow, architecture ready to grow</text>,<path d="M60 360 l4 -4 4 4 -4 4 Z" fill="#22D3EE" opacity=".85"/><text x="76" y="364" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#22D3EE" letter-spacing="1.2">APIS &amp; DATA</text><text x="224" y="364" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.2" font-weight="400" fill="#7C8EA9">REST endpoints, auth flows, MongoDB and SQL</text>,<path d="M60 382 l4 -4 4 4 -4 4 Z" fill="#A78BFA" opacity=".85"/><text x="76" y="386" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#7FE3F5" letter-spacing="1.2">LAUNCHES</text><text x="224" y="386" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.2" font-weight="400" fill="#7C8EA9">clean Git workflow, shipped on Vercel and Netlify</text><rect x="618" y="146" width="350" height="244" rx="16" fill="#05080E" opacity=".92"/><rect x="618" y="146" width="350" height="244" rx="16" fill="none" stroke="#1B3049" stroke-width="1"/><rect x="619" y="147" width="348" height="1" fill="url(#topSheen)"/><circle cx="638" cy="168" r="4" fill="#20334A"/><circle cx="652" cy="168" r="4" fill="#20334A"/><circle cx="666" cy="168" r="4" fill="#22D3EE" opacity=".75"/><text x="684" y="172" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#5A6B85" letter-spacing="0.8">mirkashi@github</text><rect x="618" y="186" width="350" height="1" fill="#101B2B"/><text x="644" y="212" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="600" fill="#22D3EE">$</text><text x="660" y="212" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#EAF2FB">whoami</text><text x="644" y="234" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', 